apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: my-api-dev
  namespace: argocd

  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:

  project: platform-demo

  source:
    repoURL: https://github.com/viraj2005-doom/Kubernetes-Internal-Development-Platform.git
    targetRevision: HEAD
    path: helm/my-api

    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: development

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true