apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-admin
  namespace: platform
  labels:
    managed-by: platform-team
    role: platform-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-admin-role
  labels:
    managed-by: platform-team
    role: platform-admin
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-admin-rolebinding
  labels:
    managed-by: platform-team
    role: platform-admin
subjects:
  - kind: ServiceAccount
    name: platform-admin
    namespace: platform
roleRef:
  kind: ClusterRole
  name: platform-admin-role
  apiGroup: rbac.authorization.k8s.io