apiVersion: v1
kind: ServiceAccount
metadata:
  name: developer
  namespace: development
  labels:
    managed-by: platform-team
    role: developer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer-role
  namespace: development
  labels:
    managed-by: platform-team
    role: developer
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
    verbs:
      - get
      - list
      - watch

  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-rolebinding
  namespace: development
  labels:
    managed-by: platform-team
    role: developer
subjects:
  - kind: ServiceAccount
    name: developer
    namespace: development
roleRef:
  kind: Role
  name: developer-role
  apiGroup: rbac.authorization.k8s.io