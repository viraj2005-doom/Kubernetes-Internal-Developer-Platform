apiVersion: v1
kind: LimitRange
metadata:
  name: development-limits
  namespace: development
  labels:
    environment: development
    managed-by: platform-team
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      min:
        cpu: "10m"
        memory: "16Mi"
      max:
        cpu: "1"
        memory: "1Gi"