apiVersion: v1
kind: LimitRange
metadata:
  name: production-limits
  namespace: production
  labels:
    environment: production
    managed-by: platform-team
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: "1Gi"
      defaultRequest:
        cpu: "250m"
        memory: "256Mi"
      min:
        cpu: "10m"
        memory: "16Mi"
      max:
        cpu: "4"
        memory: "4Gi"